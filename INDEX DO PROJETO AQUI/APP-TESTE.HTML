<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOX1111 - Soluções Imobiliárias Premium</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #000000 0%, #0a0a0a 100%);
            color: #f5f5f5;
            max-width: 100%;
            overflow-x: hidden;
        }
        
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            background: #0f0f0f;
            min-height: 100vh;
            box-shadow: 0 0 50px rgba(0, 255, 100, 0.15);
            position: relative;
            overflow: hidden;
        }
        
        /* Splash Screen Animação */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #000 0%, #0a0f0a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: fadeOut 0.8s ease-out 2.5s forwards;
        }
        
        .splash-logo {
            position: relative;
            margin-bottom: 40px;
        }
        
        .logo-box {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: pulse 2s infinite, rotate 3s linear infinite;
            transform-style: preserve-3d;
        }
        
        .logo-box-inner {
            width: 100px;
            height: 100px;
            background: #000;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 900;
            color: #00ff88;
        }
        
        .splash-title {
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(to right, #00ff88, #00ffaa, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 10px;
            animation: slideUp 1s ease-out 0.5s both;
        }
        
        .splash-subtitle {
            color: #aaa;
            font-size: 1.2rem;
            text-align: center;
            animation: slideUp 1s ease-out 0.7s both;
        }
        
        .loading-bar {
            width: 200px;
            height: 4px;
            background: #222;
            border-radius: 2px;
            margin-top: 40px;
            overflow: hidden;
            animation: slideUp 1s ease-out 0.9s both;
        }
        
        .loading-progress {
            width: 0%;
            height: 100%;
            background: linear-gradient(to right, #00ff88, #00ffaa);
            border-radius: 2px;
            animation: loading 2s ease-in-out forwards;
        }
        
        /* Tela de Login */
        .login-screen {
            padding: 30px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: linear-gradient(135deg, #0a0a0a 0%, #111 100%);
            position: relative;
            overflow: hidden;
        }
        
        .login-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.05;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 255, 136, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 255, 136, 0.1) 0%, transparent 50%);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
            z-index: 1;
        }
        
        .login-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .login-logo-box {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 900;
            color: #000;
        }
        
        .login-logo h1 {
            font-size: 2.2rem;
            font-weight: 900;
            background: linear-gradient(to right, #00ff88, #00cc6a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .login-subtitle {
            color: #aaa;
            font-size: 1rem;
            max-width: 300px;
            margin: 0 auto;
            line-height: 1.5;
        }
        
        .login-form {
            background: rgba(26, 26, 26, 0.8);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            border: 1px solid rgba(0, 255, 136, 0.1);
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 1;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .login-form:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.1);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #ddd;
            font-weight: 500;
            font-size: 0.95rem;
        }
        
        .form-control {
            width: 100%;
            padding: 16px;
            background: rgba(34, 34, 34, 0.8);
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s;
        }
        
        .form-control:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.1);
        }
        
        .btn {
            padding: 16px 24px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            color: #000;
            width: 100%;
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        
        .btn-secondary {
            background: rgba(51, 51, 51, 0.8);
            color: #fff;
            width: 100%;
        }
        
        .btn-google {
            background: linear-gradient(135deg, #4285F4, #2a56c6);
            color: white;
        }
        
        .btn-facebook {
            background: linear-gradient(135deg, #3b5998, #2d4373);
            color: white;
        }
        
        .social-login {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .social-login .btn {
            flex: 1;
        }
        
        .login-footer {
            text-align: center;
            margin-top: 25px;
            color: #888;
            font-size: 0.9rem;
            position: relative;
            z-index: 1;
        }
        
        .login-footer a {
            color: #00ff88;
            text-decoration: none;
            font-weight: 600;
        }
        
        /* Cabeçalho do App */
        .app-header {
            background: linear-gradient(135deg, #000 0%, #111 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 255, 136, 0.1);
            position: relative;
            overflow: hidden;
        }
        
        .app-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 136, 0.05), transparent);
            animation: shimmer 3s infinite;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .logo-box-small {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: #000;
            font-size: 1.2rem;
        }
        
        .logo h1 {
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(to right, #00ff88, #00cc6a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.3s;
        }
        
        .user-profile:hover {
            background: rgba(0, 255, 136, 0.1);
        }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #000;
        }
        
        .user-info {
            display: flex;
            flex-direction: column;
        }
        
        .user-name {
            font-size: 0.9rem;
            font-weight: 600;
            color: #fff;
        }
        
        .user-role {
            font-size: 0.7rem;
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 700;
            margin-top: 3px;
        }
        
        /* Barra de busca */
        .search-bar {
            padding: 15px 20px;
            background: rgba(26, 26, 26, 0.9);
            border-bottom: 1px solid rgba(0, 255, 136, 0.1);
            backdrop-filter: blur(10px);
        }
        
        .search-container {
            display: flex;
            gap: 10px;
        }
        
        .search-input {
            flex: 1;
            padding: 14px 18px;
            background: rgba(34, 34, 34, 0.8);
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            transition: all 0.3s;
        }
        
        .search-input:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.1);
        }
        
        .search-btn {
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            color: #000;
            border: none;
            border-radius: 12px;
            width: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .search-btn:hover {
            transform: scale(1.05);
        }
        
        /* Filtros */
        .filters-section {
            padding: 15px 20px;
            background: rgba(26, 26, 26, 0.9);
            border-bottom: 1px solid rgba(0, 255, 136, 0.1);
            backdrop-filter: blur(10px);
        }
        
        .filter-tags {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        
        .filter-tag {
            background: rgba(34, 34, 34, 0.8);
            color: #ccc;
            padding: 10px 18px;
            border-radius: 25px;
            font-size: 0.85rem;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid rgba(0, 255, 136, 0.1);
        }
        
        .filter-tag.active {
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            color: #000;
            font-weight: 700;
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.2);
        }
        
        .filter-tag:hover {
            transform: translateY(-2px);
            border-color: #00ff88;
        }
        
        /* Conteúdo principal */
        .app-content {
            padding: 20px;
            padding-bottom: 90px;
            min-height: calc(100vh - 200px);
        }
        
        /* Cartões de propriedade */
        .property-card {
            background: rgba(26, 26, 26, 0.8);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            margin-bottom: 25px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(0, 255, 136, 0.1);
            backdrop-filter: blur(10px);
            position: relative;
            opacity: 0;
            animation: fadeInUp 0.6s ease-out forwards;
        }
        
        .property-card:hover {
            transform: translateY(-8px) scale(1.01);
            box-shadow: 0 15px 40px rgba(0, 255, 136, 0.15);
            border-color: rgba(0, 255, 136, 0.3);
        }
        
        .property-image {
            height: 220px;
            width: 100%;
            background-size: cover;
            background-position: center;
            position: relative;
            overflow: hidden;
        }
        
        .property-image::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
        }
        
        .property-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.8);
            color: #00ff88;
            padding: 8px 15px;
            border-radius: 25px;
            font-size: 0.8rem;
            font-weight: bold;
            backdrop-filter: blur(5px);
            z-index: 2;
            border: 1px solid rgba(0, 255, 136, 0.3);
        }
        
        .property-price {
            position: absolute;
            bottom: 15px;
            left: 15px;
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.95), rgba(0, 204, 106, 0.95));
            color: #000;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 1.4rem;
            font-weight: 900;
            z-index: 2;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .property-favorite {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            cursor: pointer;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 2;
            transition: all 0.3s;
        }
        
        .property-favorite:hover {
            transform: scale(1.1);
        }
        
        .property-favorite.active {
            color: #ff3366;
            background: rgba(255, 51, 102, 0.2);
            border-color: #ff3366;
        }
        
        .property-info {
            padding: 22px;
        }
        
        .property-title {
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 10px;
            color: #fff;
            line-height: 1.3;
        }
        
        .property-address {
            color: #aaa;
            font-size: 0.95rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .property-description {
            color: #ccc;
            font-size: 0.95rem;
            margin-bottom: 15px;
            line-height: 1.6;
        }
        
        .property-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }
        
        .property-tag {
            background: rgba(0, 255, 136, 0.1);
            color: #00ff88;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            border: 1px solid rgba(0, 255, 136, 0.2);
        }
        
        .property-features {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid rgba(0, 255, 136, 0.1);
            padding-top: 18px;
        }
        
        .feature {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.85rem;
            color: #aaa;
        }
        
        .feature i {
            font-size: 1.4rem;
            margin-bottom: 6px;
            color: #00ff88;
        }
        
        .property-actions {
            display: flex;
            gap: 12px;
            margin-top: 18px;
        }
        
        .action-btn {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
            font-size: 0.9rem;
            border: none;
        }
        
        .action-btn.primary {
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            color: #000;
        }
        
        .action-btn.secondary {
            background: rgba(51, 51, 51, 0.8);
            color: #fff;
            border: 1px solid rgba(0, 255, 136, 0.1);
        }
        
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        /* Área do Vendedor */
        .seller-dashboard {
            padding: 20px;
        }
        
        .seller-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .seller-stat {
            background: rgba(26, 26, 26, 0.8);
            border-radius: 18px;
            padding: 22px;
            text-align: center;
            border: 1px solid rgba(0, 255, 136, 0.1);
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }
        
        .seller-stat:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 255, 136, 0.3);
            box-shadow: 0 10px 25px rgba(0, 255, 136, 0.1);
        }
        
        .seller-stat.green {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.1), rgba(0, 204, 106, 0.1));
            border-color: rgba(0, 255, 136, 0.3);
        }
        
        .seller-stat-value {
            font-size: 2.2rem;
            font-weight: 900;
            color: #00ff88;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }
        
        .seller-stat-label {
            color: #aaa;
            font-size: 0.9rem;
        }
        
        .seller-properties {
            margin-top: 30px;
        }
        
        /* Sistema de Chat */
        .chat-container {
            height: calc(100vh - 180px);
            display: flex;
            flex-direction: column;
            background: #0f0f0f;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(0, 255, 136, 0.1);
        }
        
        .chat-header {
            background: rgba(26, 26, 26, 0.9);
            padding: 20px;
            border-bottom: 1px solid rgba(0, 255, 136, 0.1);
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .chat-contact-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #000;
            font-size: 1.2rem;
        }
        
        .chat-contact-info h3 {
            color: #fff;
            font-size: 1.2rem;
            margin-bottom: 5px;
        }
        
        .chat-contact-info p {
            color: #00ff88;
            font-size: 0.85rem;
            font-weight: 600;
        }
        
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .message {
            max-width: 80%;
            padding: 15px;
            border-radius: 18px;
            position: relative;
            animation: messageIn 0.3s ease-out;
        }
        
        .message.sent {
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            color: #000;
            align-self: flex-end;
            border-bottom-right-radius: 5px;
        }
        
        .message.received {
            background: rgba(51, 51, 51, 0.8);
            color: #fff;
            align-self: flex-start;
            border-bottom-left-radius: 5px;
        }
        
        .message-time {
            font-size: 0.7rem;
            margin-top: 5px;
            opacity: 0.7;
            text-align: right;
        }
        
        .chat-input-area {
            padding: 20px;
            background: rgba(26, 26, 26, 0.9);
            border-top: 1px solid rgba(0, 255, 136, 0.1);
            display: flex;
            gap: 12px;
        }
        
        .chat-input {
            flex: 1;
            padding: 15px 20px;
            background: rgba(34, 34, 34, 0.8);
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 25px;
            color: #fff;
            font-size: 1rem;
        }
        
        .chat-send-btn {
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            color: #000;
            border: none;
            border-radius: 50%;
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .chat-send-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.3);
        }
        
        .chats-list {
            margin-top: 20px;
        }
        
        .chat-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 18px;
            background: rgba(26, 26, 26, 0.8);
            border-radius: 15px;
            margin-bottom: 12px;
            border: 1px solid rgba(0, 255, 136, 0.1);
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .chat-item:hover {
            transform: translateX(5px);
            border-color: rgba(0, 255, 136, 0.3);
            background: rgba(0, 255, 136, 0.05);
        }
        
        .chat-item.unread {
            background: rgba(0, 255, 136, 0.1);
            border-color: rgba(0, 255, 136, 0.3);
        }
        
        .chat-item-info {
            flex: 1;
        }
        
        .chat-item-name {
            color: #fff;
            font-weight: 700;

                    setActiveTab('chat');

                        chat.userId === userId ? {...chat, unread: 0} : chat

                e.preventDefault();
                
                if (!newMessage.trim()) return;

                    id: messages.length + 1,
                    senderId: currentUser.id,
                    text: newMessage,
                    time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                    sent: true

                setMessages([...messages, newMsg]);
                setNewMessage('');
                
                // Simular resposta após 1 segundo
                setTimeout(() => {
                    const responses = [
                        "Obrigado pela sua mensagem!",
                        "Posso te ajudar com mais alguma coisa?",
                        "Vou verificar essa informação e te retorno.",
                        "Perfeito, anotei seu interesse."

                        id: messages.length + 2,
                        senderId: activeChat.id,
                        text: randomResponse,
                        time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),

        // Renderizar o aplicativo
        ReactDOM.render(<App />, document.getElementById('app'));
